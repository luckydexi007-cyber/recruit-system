<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>车辆与交通学院·团总支学生会 | 招新系统</title>
<style>
:root{
--primary:#C41E3A;--accent:#A0182E;--background:#F0F2F5;--panel-bg:#FAFBFC;--card-bg:#fff;
--tooltip-bg:#454545;--success:#40B43E;--warning:#EBA400;--destructive:#E65C53;
--destructive-hover:#D14B42;--primary-foreground:#fff;--text-primary:rgba(0,0,0,.85);
--text-secondary:rgba(0,0,0,.5);--text-tertiary:rgba(0,0,0,.35);--intensity-0:rgba(0,0,0,0);
--intensity-3:rgba(0,0,0,.03);--intensity-4:rgba(0,0,0,.04);--intensity-6:rgba(0,0,0,.06);
--intensity-8:rgba(0,0,0,.08);--intensity-12:rgba(0,0,0,.12);--intensity-16:rgba(0,0,0,.16);
--intensity-20:rgba(0,0,0,.2);--intensity-35:rgba(0,0,0,.35);--intensity-60:rgba(0,0,0,.6);
--input-shadow:rgba(0,0,0,.08);--radius-sm:8px;--radius-md:10px;--radius-lg:14px;--radius-xl:18px;
font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}
@media (prefers-color-scheme:dark){
:root{
--background:#1A1A1D;--panel-bg:#252528;--card-bg:#2C2C30;--tooltip-bg:#BABABA;
--primary-foreground:#fff;--text-primary:rgba(255,255,255,.85);--text-secondary:rgba(255,255,255,.5);
--text-tertiary:rgba(255,255,255,.35);--intensity-0:rgba(255,255,255,0);
--intensity-3:rgba(255,255,255,.03);--intensity-4:rgba(255,255,255,.04);
--intensity-6:rgba(255,255,255,.06);--intensity-8:rgba(255,255,255,.08);
--intensity-12:rgba(255,255,255,.12);--intensity-16:rgba(255,255,255,.16);
--intensity-20:rgba(255,255,255,.2);--intensity-35:rgba(255,255,255,.35);
--intensity-60:rgba(255,255,255,.6);--input-shadow:rgba(0,0,0,.28)
}
}
*{box-sizing:border-box;margin:0;padding:0}
button,a,[role=button]{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.55}
body{background:var(--background);color:var(--text-primary);min-height:100vh}
.page-wrap{max-width:1200px;margin:0 auto;padding:0}
.top-bar{background:linear-gradient(135deg,#C41E3A,#8B0000);color:#fff;padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:64px;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.15)}
.top-bar .logo{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:600;letter-spacing:1px}
.top-bar .logo .icon{width:36px;height:36px;background:rgba(255,255,255,.2);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px}
.top-bar .nav{display:flex;gap:4px}
.top-bar .nav button{background:transparent;border:0;color:rgba(255,255,255,.8);padding:8px 12px;border-radius:8px;font-size:13px;transition:all .15s;white-space:nowrap}
.top-bar .nav button:hover{background:rgba(255,255,255,.15);color:#fff}
.top-bar .nav button.active{background:rgba(255,255,255,.2);color:#fff;font-weight:500}
.top-bar .user-info{display:flex;align-items:center;gap:12px;font-size:13px}
.top-bar .user-info .logout-btn{background:rgba(255,255,255,.15);border:0;color:#fff;padding:6px 12px;border-radius:8px;font-size:12px}
.top-bar .user-info .logout-btn:hover{background:rgba(255,255,255,.25)}
.main-content{padding:24px}
.section-title{font-size:22px;font-weight:600;margin-bottom:20px;border-left:4px solid var(--primary);padding-left:12px;color:var(--text-primary)}
.card{background:var(--card-bg);border:.5px solid var(--intensity-8);border-radius:var(--radius-lg);padding:24px;margin-bottom:20px}
.card-sm{background:var(--card-bg);border:.5px solid var(--intensity-8);border-radius:var(--radius-md);padding:16px}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:13px;font-weight:500;color:var(--text-primary);margin-bottom:6px}
.form-group input,.form-group select,.form-group textarea{width:100%;height:40px;border:.5px solid var(--intensity-12);border-radius:var(--radius-md);background:var(--intensity-4);color:var(--text-primary);padding:0 12px;font-size:13px;outline:none;transition:border .15s}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--primary);box-shadow:0 0 0 2px color-mix(in srgb,var(--primary) 20%,transparent)}
.form-group textarea{height:80px;padding:10px 12px;resize:vertical}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{height:40px;padding:0 20px;border:0;border-radius:var(--radius-md);font-size:13px;font-weight:500;transition:all .15s;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn-primary{background:var(--primary);color:var(--primary-foreground)}
.btn-primary:hover{background:var(--accent)}
.btn-secondary{background:var(--intensity-6);color:var(--text-primary);border:.5px solid var(--intensity-8)}
.btn-secondary:hover{background:var(--intensity-12)}
.btn-success{background:var(--success);color:#fff}
.btn-success:hover{opacity:.9}
.btn-danger{background:var(--destructive);color:#fff}
.btn-danger:hover{background:var(--destructive-hover)}
.btn-sm{height:32px;padding:0 14px;font-size:12px}
.btn-block{width:100%}
.hero-section{background:linear-gradient(135deg,#C41E3A,#8B0000,#5C0000);border-radius:var(--radius-xl);padding:48px 40px;color:#fff;margin-bottom:24px;position:relative;overflow:hidden}
.hero-section::before{content:'';position:absolute;top:-50%;right:-20%;width:400px;height:400px;background:rgba(255,255,255,.05);border-radius:50%}
.hero-section::after{content:'';position:absolute;bottom:-30%;left:-10%;width:300px;height:300px;background:rgba(255,255,255,.05);border-radius:50%}
.hero-section h1{font-size:32px;font-weight:700;margin-bottom:12px;position:relative}
.hero-section p{font-size:15px;opacity:.9;line-height:1.7;max-width:700px;position:relative}
.hero-section .hero-tag{display:inline-block;background:rgba(255,255,255,.2);padding:4px 14px;border-radius:20px;font-size:12px;margin-bottom:16px;position:relative}
.dept-tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.dept-tabs button{padding:8px 16px;border:.5px solid var(--intensity-12);border-radius:999px;background:transparent;font-size:13px;color:var(--text-secondary);transition:all .15s}
.dept-tabs button:hover{background:var(--intensity-4);color:var(--text-primary)}
.dept-tabs button.active{background:var(--primary);color:#fff;border-color:var(--primary);font-weight:500}
.tab-bar{display:flex;gap:8px;margin-bottom:20px;border-bottom:.5px solid var(--intensity-8);padding-bottom:12px;overflow-x:auto}
.tab-bar button{background:transparent;border:0;padding:8px 16px;border-radius:var(--radius-md);font-size:13px;color:var(--text-secondary);transition:all .15s;white-space:nowrap}
.tab-bar button:hover{background:var(--intensity-4);color:var(--text-primary)}
.tab-bar button.active{background:color-mix(in srgb,var(--primary) 12%,transparent);color:var(--primary);font-weight:500}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
table th{text-align:left;padding:10px 12px;color:var(--text-secondary);font-weight:500;font-size:12px;border-bottom:1px solid var(--intensity-8)}
table td{padding:10px 12px;border-bottom:.5px solid var(--intensity-6)}
table tr:hover{background:var(--intensity-3)}
.chip-group{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;font-size:11px;font-weight:500;background:color-mix(in srgb,var(--primary) 12%,transparent);color:var(--primary);border:.5px solid color-mix(in srgb,var(--primary) 20%,transparent)}
.chip-admitted{background:color-mix(in srgb,var(--success) 18%,transparent);color:var(--success);border:.5px solid color-mix(in srgb,var(--success) 30%,transparent)}
.chip-reallocate{background:color-mix(in srgb,#58B2DC 18%,transparent);color:#58B2DC;border:.5px solid color-mix(in srgb,#58B2DC 30%,transparent)}
.status-pending{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 10px;border-radius:999px;font-size:11px;font-weight:500;background:color-mix(in srgb,var(--warning) 18%,transparent);color:var(--warning);border:.5px solid color-mix(in srgb,var(--warning) 30%,transparent)}
.status-admitted{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 10px;border-radius:999px;font-size:11px;font-weight:500;background:color-mix(in srgb,var(--success) 18%,transparent);color:var(--success);border:.5px solid color-mix(in srgb,var(--success) 30%,transparent)}
.status-rejected{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 10px;border-radius:999px;font-size:11px;font-weight:500;background:color-mix(in srgb,var(--destructive) 18%,transparent);color:var(--destructive);border:.5px solid color-mix(in srgb,var(--destructive) 30%,transparent)}
.status-reallocate{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 10px;border-radius:999px;font-size:11px;font-weight:500;background:color-mix(in srgb,#58B2DC 18%,transparent);color:#58B2DC;border:.5px solid color-mix(in srgb,#58B2DC 30%,transparent)}
.success-anim{text-align:center;padding:40px 20px}
.success-anim .check{width:72px;height:72px;border-radius:50%;background:color-mix(in srgb,var(--success) 18%,transparent);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:36px;color:var(--success)}
.success-anim h3{font-size:20px;font-weight:600;margin-bottom:8px}
.success-anim p{font-size:14px;color:var(--text-secondary)}
.congrats-box{background:linear-gradient(135deg,color-mix(in srgb,var(--success) 10%,transparent),color-mix(in srgb,var(--success) 5%,transparent));border:1px solid color-mix(in srgb,var(--success) 30%,transparent);border-radius:var(--radius-lg);padding:24px;text-align:center;margin-top:16px}
.congrats-box .big-icon{font-size:48px;margin-bottom:8px}
.congrats-box h3{font-size:22px;color:var(--success);font-weight:600}
.login-toggle{text-align:center;margin-bottom:16px;display:flex;gap:0;border:.5px solid var(--intensity-12);border-radius:var(--radius-md);overflow:hidden}
.login-toggle button{flex:1;padding:10px;border:0;background:transparent;font-size:13px;color:var(--text-secondary);transition:all .15s}
.login-toggle button.active{background:var(--primary);color:#fff;font-weight:500}
.auth-switch{text-align:center;margin-top:16px;font-size:13px;color:var(--text-secondary)}
.auth-switch a{color:var(--primary);cursor:pointer;font-weight:500}
.alert{background:color-mix(in srgb,var(--destructive) 12%,transparent);border:1px solid color-mix(in srgb,var(--destructive) 25%,transparent);color:var(--destructive);padding:10px 14px;border-radius:var(--radius-md);font-size:13px;margin-bottom:12px}
.alert-success{background:color-mix(in srgb,var(--success) 12%,transparent);border:1px solid color-mix(in srgb,var(--success) 25%,transparent);color:var(--success)}
.hidden{display:none!important}
.footer{background:var(--panel-bg);border-top:.5px solid var(--intensity-8);padding:20px 24px;text-align:center;font-size:12px;color:var(--text-secondary);margin-top:20px}
.checkbox-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.checkbox-item{display:flex;align-items:center;gap:8px;padding:10px 12px;border:.5px solid var(--intensity-8);border-radius:var(--radius-md);cursor:pointer;transition:all .15s;user-select:none}
.checkbox-item:hover{background:var(--intensity-3)}
.checkbox-item.selected{background:color-mix(in srgb,var(--primary) 10%,transparent);border-color:var(--primary)}
.checkbox-item .cb-box{width:20px;height:20px;border-radius:4px;border:1.5px solid var(--intensity-20);display:flex;align-items:center;justify-content:center;font-size:11px;color:transparent;transition:all .15s;flex-shrink:0}
.checkbox-item.selected .cb-box{background:var(--primary);border-color:var(--primary);color:#fff}
.checkbox-item .cb-label{font-size:13px;font-weight:500}
.upload-zone{position:relative;border:1.5px dashed var(--intensity-20);border-radius:var(--radius-md);padding:20px;text-align:center;transition:all .2s;background:var(--intensity-3);cursor:pointer}
.upload-zone:hover{border-color:var(--primary);background:color-mix(in srgb,var(--primary) 5%,transparent)}
.upload-zone.has-file{border-style:solid;border-color:var(--success);background:color-mix(in srgb,var(--success) 6%,transparent)}
.upload-zone .uz-icon{font-size:32px;margin-bottom:8px}
.upload-zone .uz-title{font-size:14px;font-weight:500;color:var(--text-primary);margin-bottom:4px}
.upload-zone .uz-hint{font-size:12px;color:var(--text-tertiary)}
.upload-zone input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer}
.file-preview-card{display:inline-flex;align-items:center;gap:10px;padding:10px 14px;background:var(--card-bg);border:.5px solid var(--intensity-8);border-radius:var(--radius-md);margin-top:8px}
.file-preview-card .fp-icon{font-size:28px}
.file-preview-card .fp-info{text-align:left}
.file-preview-card .fp-name{font-size:13px;font-weight:500;color:var(--text-primary);max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-preview-card .fp-size{font-size:11px;color:var(--text-tertiary)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:999;padding:20px}
.modal-card{background:var(--card-bg);border-radius:var(--radius-xl);padding:24px;max-width:600px;width:100%;max-height:80vh;overflow:auto;box-shadow:0 10px 40px var(--input-shadow)}
.modal-card .modal-close{float:right;background:var(--intensity-6);border:0;width:32px;height:32px;border-radius:50%;font-size:16px;display:flex;align-items:center;justify-content:center;color:var(--text-secondary)}
.modal-card .modal-close:hover{background:var(--intensity-12)}
.modal-card .modal-title{font-size:17px;font-weight:600;margin-bottom:16px}
.sel-reallocate{height:28px;border:.5px solid #58B2DC;border-radius:6px;background:var(--intensity-4);color:#58B2DC;padding:0 6px;font-size:11px;outline:none;width:100%;font-weight:500}
.cloud-badge{display:inline-flex;align-items:center;gap:4px;background:color-mix(in srgb,var(--success) 12%,transparent);color:var(--success);border:.5px solid color-mix(in srgb,var(--success) 25%,transparent);border-radius:999px;padding:2px 10px;font-size:11px;margin-left:10px;vertical-align:middle}
@media(max-width:640px){
.top-bar{padding:0 12px;height:56px}
.top-bar .logo{font-size:14px;gap:6px}
.top-bar .nav{overflow-x:auto;gap:0}
.top-bar .nav button{font-size:11px;padding:6px 8px}
.main-content{padding:12px}
.hero-section{padding:28px 20px}
.hero-section h1{font-size:24px}
.form-row,.checkbox-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="page-wrap" id="app">
<div class="top-bar">
<div class="logo"><div class="icon">🚗</div>车辆与交通学院·团总支学生会</div>
<div class="nav" id="mainNav">
<button class="active" data-page="home">首页</button>
<button data-page="depts">部门介绍</button>
<button data-page="register">注册</button>
<button data-page="login">登录</button>
<button data-page="resume">投递简历</button>
</div>
<div class="user-info" id="userInfo">
<span id="userDisplay" style="display:none"></span>
<button class="logout-btn" id="logoutBtn" style="display:none">退出</button>
</div>
</div>
<div class="main-content" id="mainContent"></div>
<div class="footer">© 2026 重庆机电职业技术大学 · 车辆与交通学院 | 渝ICP备12000681号 <span class="cloud-badge">🔗 云端同步已启用</span></div>
</div>
<script>
(function(){
const DEPT_DATA=[
{id:'office',name:'办公室',icon:'📋',color:'#2B7BBA',items:[
{title:'组织策划',desc:'统筹各类团学活动策划落地，负责后勤物资协调与部门联动，助力校园文化建设。'},
{title:'能力培养',desc:'锻炼公文办公与统筹沟通能力，搭建交流平台，拓展人脉资源。'},
{title:'资源对接',desc:'对接上级落实团务政策，统筹经费物资全流程管理，统筹调配资源提升使用效率。'},
{title:'综合统筹',desc:'做好上传下达、文件流转与日常行政事务，衔接各板块工作，保障团总支整体运转顺畅高效。'}
]},
{id:'org',name:'组织部',icon:'📌',color:'#E67E22',items:[
{title:'团务基础统筹',desc:'管理全院团员档案信息，完成团组织关系转接、团费收缴；规范团员入团流程，把控团员基础团务各项工作，夯实团组织根基。'},
{title:'团日与团课策划',desc:'抓实团员思想引领，策划各类主题团日活动、思政团课；负责推优入党、团员评优评奖工作，设计多样化团建活动，丰富团员思想文化生活。'},
{title:'能力成长实践',desc:'参与团学综合事务对接，协助各类团务资料整理汇总；学习活动统筹、沟通对接与材料撰写，对接学院各学生组织，在实践中锻炼成长。'}
]},
{id:'propaganda',name:'宣传部',icon:'📷',color:'#C41E3A',items:[
{title:'摄影摄像',desc:'记录学院重大活动，用镜头讲述车辆人的故事，捕捉精彩瞬间。'},
{title:'文案策划',desc:'撰写新闻稿件、策划宣传活动，用文字传递力量，讲好学院故事。'},
{title:'设计排版',desc:'海报设计、公众号排版，用创意装点校园生活，打造视觉亮点。'},
{title:'新媒体运营',desc:'运营学院官方平台，打造校园新媒体矩阵，扩大宣传影响力。'}
]},
{id:'study',name:'学习部',icon:'📚',color:'#388E3C',items:[
{title:'学风建设',desc:'营造良好校园学习氛围，策划学风主题活动，督促开展学风相关工作。'},
{title:'学习活动举办',desc:'组织知识竞赛、演讲比赛、读书会、学习经验分享会等学术类活动。'},
{title:'对接师生',desc:'收集同学们在学习中的问题、意见，反馈给任课老师与教务处；传达教学通知。'},
{title:'活动协助',desc:'配合学生会其他部门，承担讲座、晚会等活动的签到、计分、主持等工作。'},
{title:'部门日常',desc:'完成学生会交办的其他任务，做好部门活动策划、记录、总结归档。'}
]},
{id:'sports',name:'文体部',icon:'🏀',color:'#7B1FA2',items:[
{title:'点燃文化之火',desc:'策划组织各类文化活动，让才华与创意在舞台绽放！'},
{title:'跃动青春脉搏',desc:'统筹协调精彩体育活动，点燃赛场激情，凝聚团队力量！'},
{title:'运筹帷幄掌资源',desc:'学习文体资源管理，保障活动顺利开展，成为幕后实力担当！'},
{title:'沟通协作促共赢',desc:'参与各部门协作对接，锻炼沟通协调能力，拓展你的校园人脉圈！'}
]},
{id:'psychology',name:'生活心理部',icon:'💚',color:'#F9A825',items:[
{title:'生活督导与数据统筹',desc:'定期开展宿舍安全卫生检查，完成评分记录与数据汇总；对接各年级形成查寝通报，用精细化管理守护宿舍安全。'},
{title:'权益保障与事务对接',desc:'负责全院学生水卡补贴信息核对与发放；对接活动开展，确保每场活动顺利落地，做校园生活保障的"最后一公里"。'},
{title:'心理健康与团辅策划',desc:'策划并执行各类主题心理团辅活动、减压工作坊；普及生活心理健康知识，营造有温度、有支持的校园心理氛围。'}
]}
];
const ALL_DEPT_NAMES=DEPT_DATA.map(d=>d.name);
const MAX_FILE_SIZE=5*1024*1024;

let SESSION={user:null,isAdmin:false,isTerminal:false};
let RESUMES=[],USERS=[],CURRENT_PAGE='home',CURRENT_TAB='pending',POLL=null;

const container=document.getElementById('mainContent');
const userDisplay=document.getElementById('userDisplay');
const logoutBtn=document.getElementById('logoutBtn');

/* ---------------- API 客户端 ---------------- */
const api={
token:localStorage.getItem('recruit_token')||'',
setToken(t){this.token=t||'';if(t)localStorage.setItem('recruit_token',t);else localStorage.removeItem('recruit_token');},
async req(method,path,body){
const h={'Content-Type':'application/json'};
if(this.token)h['Authorization']='Bearer '+this.token;
const r=await fetch(path,{method:method,headers:h,body:body?JSON.stringify(body):undefined});
let d={};try{d=await r.json();}catch(e){d={};}
if(!r.ok){throw new Error(d.error||('请求失败 ('+r.status+')'));}
return d;
},
get(p){return this.req('GET',p);},
post(p,b){return this.req('POST',p,b);},
del(p){return this.req('DELETE',p);}
};

function previewFile(file){
const isImg=['png','jpg','jpeg','gif','webp','bmp'].some(ext=>file.type.includes(ext)||file.name.toLowerCase().endsWith(ext));
const overlay=document.createElement('div');overlay.className='modal-overlay';overlay.onclick=function(e){if(e.target===overlay)overlay.remove();};
let bodyHtml='';
if(isImg){bodyHtml=`<img src="${file.data}" style="max-width:100%;max-height:60vh;display:block;margin:0 auto;border-radius:8px;" alt="预览">`;}
else if(file.type.includes('pdf')){bodyHtml=`<iframe src="${file.data}" style="width:100%;height:60vh;border:0;border-radius:8px;" title="PDF预览"></iframe>`;}
else{bodyHtml=`<div style="text-align:center;padding:40px;"><div style="font-size:64px;margin-bottom:16px;">📄</div><p style="font-size:15px;font-weight:500;margin-bottom:8px;">${file.name}</p><p style="font-size:13px;color:var(--text-secondary);margin-bottom:20px;">不支持在线预览，请下载查看</p></div>`;}
overlay.innerHTML=`<div class="modal-card"><button class="modal-close" id="modalCloseBtn">✕</button><div class="modal-title">📎 附件预览 · ${file.name}</div>${bodyHtml}<div style="text-align:center;margin-top:12px;"><button class="btn btn-primary btn-sm" id="modalDownloadBtn2">⬇️ 下载到本地</button></div></div>`;
document.body.appendChild(overlay);
document.getElementById('modalCloseBtn').addEventListener('click',()=>overlay.remove());
document.getElementById('modalDownloadBtn2').addEventListener('click',()=>downloadFile(file));
}
function downloadFile(file){const a=document.createElement('a');a.href=file.data;a.download=file.name;document.body.appendChild(a);a.click();a.remove();}

function registerDeptCheckboxes(){const items=document.querySelectorAll('.checkbox-item');const hint=document.getElementById('deptCountHint');if(!items.length)return;items.forEach(item=>{const cb=item.querySelector('.dept-check');item.addEventListener('click',function(e){e.preventDefault();const checked=document.querySelectorAll('.dept-check:checked').length;if(!cb.checked&&checked>=3){alert('最多只能选择3个部门');return}cb.checked=!cb.checked;this.classList.toggle('selected',cb.checked);const cnt=document.querySelectorAll('.dept-check:checked').length;if(hint)hint.textContent='已选择 '+cnt+' / 3 个部门';});});}

/* ---------------- 初始化 ---------------- */
window._navigate=navigate;
document.querySelectorAll('#mainNav button').forEach(b=>{b.addEventListener('click',function(){navigate(this.dataset.page);});});
logoutBtn.addEventListener('click',async function(){
try{await api.post('/api/logout',{});}catch(e){}
api.setToken('');SESSION={user:null,isAdmin:false,isTerminal:false};
renderNav();navigate('home');
});
async function boot(){
if(api.token){
try{const me=await api.get('/api/me');if(me&&me.user){setSession(me);}else{api.setToken('');}}catch(e){api.setToken('');}
}
renderNav();
let page=localStorage.getItem('recruit_page')||'home';
if(!SESSION.isAdmin&&page==='admin')page='home';
if(!SESSION.user&&(page==='resume'||page==='userCenter'))page='home';
navigate(page);
}
boot();
})();
</script>
</body>
